<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>נחש ת'מילה 🗣️</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js" async></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============================================================ -->
<!-- GLOBAL PAGE HEADER                                          -->
<!-- ============================================================ -->
<div id="page-header" class="page-header" style="display:none">
  <button class="page-header-title" onclick="goHome()">נחש ת׳מילה</button>
  <div id="header-slot"></div>
</div>

<!-- ============================================================ -->
<!-- PICKER BOTTOM SHEET (shared)                                -->
<!-- ============================================================ -->
<!-- ============================================================ -->
<!-- INFO BOTTOM SHEET (how-to-play + about)                    -->
<!-- ============================================================ -->
<div id="info-backdrop" onclick="closeInfo()"></div>
<div id="info-sheet">
  <div class="info-handle"></div>
  <div class="info-tabs">
    <button type="button" class="info-tab active" id="tab-rules" onclick="switchInfoTab('rules')">
      <iconify-icon icon="mdi:help-circle-outline"></iconify-icon> איך משחקים
    </button>
    <button type="button" class="info-tab" id="tab-about" onclick="switchInfoTab('about')">
      <iconify-icon icon="mdi:information-outline"></iconify-icon> אודות
    </button>
  </div>
  <div id="info-content"></div>
</div>

<div id="picker-backdrop" onclick="closePicker()"></div>
<div id="picker-sheet">
  <div class="picker-handle"></div>
  <div class="picker-title" id="picker-title"></div>
  <div id="picker-content"></div>
</div>

<!-- ===================== SCREEN 1: START (SPLASH) ===================== -->
<div id="screen-home" class="screen active">

  <!-- Icon-only info button top-left -->
  <button type="button" class="home-help-btn" onclick="openInfo('rules')">
    <iconify-icon icon="mdi:help-circle-outline"></iconify-icon>
  </button>

  <!-- Centered content -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; padding: 0 24px;">
    <div class="logo">
      <div class="logo-text">נחש ת׳מילה</div>
      <div class="logo-sub">מסביר · מנחש · מנצח</div>
    </div>
    <p class="splash-desc">משחק הסבר וניחוש לקבוצות<br>מסבירים מילים, מנצחים ראשונים!</p>

    <div style="width:100%; margin-top:32px;">
      <button type="button" class="btn btn-primary" onclick="goToSettings()">
        <iconify-icon icon="mdi:play-circle-outline"></iconify-icon> התחילו משחק!
      </button>
      <div class="home-footer">
        <button class="footer-link" onclick="openInfo('rules')"><iconify-icon icon="mdi:help-circle-outline"></iconify-icon> איך משחקים</button>
        <span class="footer-sep">·</span>
        <button class="footer-link" onclick="openInfo('about')"><iconify-icon icon="mdi:information-outline"></iconify-icon> אודות</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== SCREEN 1b: SETTINGS ===================== -->
<div id="screen-settings" class="screen has-header">
  <div style="width:100%; padding: 20px 20px 44px; display:flex; flex-direction:column; align-items:center; gap:0;">

    <div class="form-section" style="margin-bottom:12px">
      <label>מספר קבוצות</label>
      <select id="num-teams" onchange="onNumTeamsChange()">
        <option value="2">2 קבוצות</option>
        <option value="3">3 קבוצות</option>
        <option value="4">4 קבוצות</option>
        <option value="5">5 קבוצות</option>
        <option value="6">6 קבוצות</option>
      </select>
    </div>

    <div class="form-section" style="margin-bottom:12px">
      <label>שמות הקבוצות</label>
      <div class="teams-grid" id="team-inputs"></div>
    </div>

    <div class="form-section" style="margin-bottom:28px">
      <label>הגדרות משחק</label>
      <div class="settings-row">
        <div class="setting-box">
          <label><iconify-icon icon="mdi:timer-outline"></iconify-icon> שניות לתור</label>
          <input type="number" id="round-time" value="60" min="20" max="180" step="5">
        </div>
        <div class="setting-box">
          <label><iconify-icon icon="mdi:trophy-outline"></iconify-icon> נקודות לניצחון</label>
          <input type="number" id="target-score" value="30" min="10" max="200" step="5">
        </div>
      </div>
    </div>

    <div style="width:100%">
      <button type="button" class="btn btn-primary" onclick="startGame()">
        <iconify-icon icon="mdi:arrow-left-circle-outline"></iconify-icon> יאללה, משחקים!
      </button>
    </div>

  </div>
</div>

<!-- ===================== SCREEN 2: TRANSFER ===================== -->
<div id="screen-transfer" class="screen has-header">
  <div class="transfer-emoji"><iconify-icon icon="mdi:cellphone-arrow-down-variant"></iconify-icon></div>
  <div class="transfer-team" id="transfer-team-name">קבוצה א׳</div>
  <div class="transfer-label">העבירו את הטלפון לקבוצה<br>ולחצו על "התחל תור" כשמוכנים</div>
  <div class="scores-preview" id="scores-preview"></div>
  <div style="width:100%">
    <button class="btn btn-primary" onclick="startTurn()"><iconify-icon icon="mdi:play-circle-outline"></iconify-icon> התחל תור</button>
  </div>
</div>

<!-- ===================== SCREEN 3: GAME ===================== -->
<div id="screen-game" class="screen has-header">
  <div class="game-top">
    <div class="game-team-name" id="game-team-name">קבוצה</div>
    <div class="timer-wrap">
      <svg class="timer-svg" viewBox="0 0 68 68">
        <circle class="timer-bg" cx="34" cy="34" r="30"/>
        <circle class="timer-arc" id="timer-arc" cx="34" cy="34" r="30"/>
      </svg>
      <div class="timer-text" id="timer-display">60</div>
    </div>
    <div class="game-score-bubble" id="round-score-display">0</div>
  </div>

  <div class="word-area">
    <div class="word-display" id="word-display">מילה</div>
    <div class="word-count" id="word-count"></div>
  </div>

  <div class="game-actions">
    <button class="btn btn-green btn-action" onclick="handleCorrect()">
      <iconify-icon icon="mdi:check-circle-outline"></iconify-icon><span class="label">נכון +1</span>
    </button>
    <div class="action-row">
      <button class="btn btn-blue btn-action" onclick="handleSkip()">
        <iconify-icon icon="mdi:skip-next-circle-outline"></iconify-icon><span class="label">דלג 0</span>
      </button>
      <button class="btn btn-red btn-action" onclick="handleWrong()">
        <iconify-icon icon="mdi:close-circle-outline"></iconify-icon><span class="label">טעות -1</span>
      </button>
    </div>
  </div>
</div>

<!-- ===================== SCREEN 4: END OF TURN ===================== -->
<div id="screen-endturn" class="screen has-header">
  <div class="endturn-header">
    <span class="endturn-emoji" id="endturn-emoji">🎉</span>
    <div class="endturn-team" id="endturn-team-name">קבוצה</div>
  </div>
  <div class="endturn-round-score" id="endturn-round-score">0</div>
  <div class="endturn-round-label">נקודות בתור</div>
  <div class="endturn-breakdown" id="endturn-breakdown"></div>
  <div class="all-scores-title"><iconify-icon icon="mdi:chart-bar"></iconify-icon> ניקוד כולל</div>
  <div class="scores-preview" id="endturn-scores"></div>
  <div style="width:100%; margin-top:20px">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="winner-progress-fill" style="width:0%"></div>
    </div>
    <button class="btn btn-primary" onclick="nextTeam()"><iconify-icon icon="mdi:arrow-left-circle-outline"></iconify-icon> לתור הבא</button>
  </div>
</div>

<!-- ===================== SCREEN 5: WINNER ===================== -->
<div id="screen-winner" class="screen has-header">
  <div class="confetti-area" id="confetti-area"></div>
  <div class="winner-crown"><iconify-icon icon="mdi:crown-outline"></iconify-icon></div>
  <div class="winner-label">המנצחת</div>
  <div class="winner-name" id="winner-name">קבוצה א׳</div>
  <div class="winner-score" id="winner-score-label"></div>
  <div class="winner-podium" id="winner-podium"></div>
  <button class="btn btn-primary" onclick="newGame()" style="width:100%"><iconify-icon icon="mdi:refresh"></iconify-icon> משחק חדש</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
